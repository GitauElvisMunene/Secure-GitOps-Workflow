name: Enhanced Secret Scanning (Snyk + GitHub)

on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Essential for thorough scanning

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Snyk CLI
        run: npm install -g snyk@latest

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Aggressive Snyk Scan
        run: |
          snyk code test --sarif \
            --all-projects \
            --detection-depth=6 \
            --severity-threshold=low \
            --file=app.js \
            --file=*.{env,config,json,js,ts} \
            > snyk-secrets.sarif || true

      - name: Validate and Enhance SARIF Output
        run: |
          # Install jq if not present
          sudo apt-get install -y jq

          # Create valid SARIF structure if empty/invalid
          if [ ! -s snyk-secrets.sarif ] || ! jq empty snyk-secrets.sarif 2>/dev/null; then
            echo '{
              "version": "2.1.0",
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "runs": [{
                "tool": {
                  "driver": {
                    "name": "Snyk",
                    "informationUri": "https://snyk.io",
                    "rules": []
                  }
                },
                "results": []
              }]
            }' > snyk-secrets.sarif
          fi

          # Debug output
          echo "=== Scan Results Summary ==="
          jq '.runs[0].results | length' snyk-secrets.sarif
          echo "=== Sample Findings ==="
          jq '.runs[0].results[0:3]' snyk-secrets.sarif

      - name: Add Test Finding If Empty (Debug)
        if: ${{ always() }}
        run: |
          if [ $(jq '.runs[0].results | length' snyk-secrets.sarif) -eq 0 ]; then
            echo "Adding test finding for validation..."
            jq '.runs[0].results += [{
              "ruleId": "manual-test",
              "message": { "text": "TEST: Hardcoded secret detected in app.js" },
              "locations": [{
                "physicalLocation": {
                  "artifactLocation": { "uri": "app.js" },
                  "region": { "startLine": 4, "endLine": 4 }
                }
              }]
            }]' snyk-secrets.sarif > tmp.sarif && mv tmp.sarif snyk-secrets.sarif
          fi

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-secrets.sarif
          check_name: "Snyk Secret Scan"
          category: "secret-scan"

      - name: Run Gitleaks (Additional Scanner)
        uses: zricethezav/gitleaks-action@v2
        with:
          config-path: https://raw.githubusercontent.com/gitleaks/gitleaks/master/config/gitleaks.toml
          redact: true
          verbose: true