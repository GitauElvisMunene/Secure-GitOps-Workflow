name: Secret Scan (Snyk)

on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  security-events: write
  contents: read  

jobs:
  snyk-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk Secrets Scan
        run: |
          snyk auth ${{ secrets.SNYK_TOKEN }}
          snyk code test --sarif > snyk-secrets.sarif || true
        

      - name: Validate and fix SARIF file
        run: |
          if [ -s snyk-secrets.sarif ] && jq '.runs | length > 0' snyk-secrets.sarif 2>/dev/null | grep -q true; then
              echo "SARIF file is valid and contains results"
          else
              echo "Creating valid SARIF file with empty run"
              echo '{
                "version": "2.1.0",
                "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                "runs": [
                  {
                    "tool": {
                      "driver": {
                        "name": "Snyk",
                        "informationUri": "https://snyk.io",
                        "rules": []
                      }
                    },
                    "results": []
                  }
                ]
              }' > snyk-secrets.sarif
              echo "⚠ Snyk output invalid or empty — created valid SARIF with empty results"
          fi

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-secrets.sarif
