name: Secret Scan (Snyk)

on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  security-events: write
  contents: read  

jobs:
  snyk-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk Secrets Scan
        run: |
          snyk auth ${{ secrets.SNYK_TOKEN }}
          snyk code test --sarif > snyk-secrets.sarif || true
        

      - name: Validate SARIF file
        run: |
          if jq empty snyk-secrets.sarif 2>/dev/null; then
              echo "SARIF file is valid JSON"
          else
            echo "{}" > snyk-secrets.sarif
            echo "⚠ Snyk output invalid — replaced with empty SARIF"
          fi

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-secrets.sarif
