name: Generate detect-secrets baseline
on:
  workflow_dispatch:   # run this manually once from Actions -> this workflow -> Run workflow

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Generate baseline
        run: detect-secrets scan > .secrets.baseline

      - name: Commit baseline back to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .secrets.baseline
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(security): add detect-secrets baseline"
            git push
          fi
